# UniFi Syslog Server -> Logstash -> Elasticsearch
#
# UniFi Syslog Server sends Elastic Common Schema (ECS) JSON:
#   - TCP: one JSON document per line (optionally TLS)  -> tcp input, codec json_lines
#   - HTTP: a JSON array of documents per request       -> http input, codec json
# Use whichever transport you configured on the Forwarding page.

input {
  tcp {
    port  => 5514
    codec => json_lines
    tags  => ["unify-syslog"]
    # TLS (set "TLS" on the destination in the app):
    # ssl_enabled     => true                       # Logstash 8.x; use ssl_enable on 7.x
    # ssl_certificate => "/etc/logstash/certs/logstash.crt"
    # ssl_key         => "/etc/logstash/certs/logstash.key"
  }

  http {
    port  => 8085
    codec => json
    tags  => ["unify-syslog"]
    # A JSON array body is split into one event per element.
    # Basic auth to match the destination's custom Authorization header:
    # user     => "unify"
    # password => "${UNIFY_HTTP_PASSWORD}"
    # ssl_enabled     => true
    # ssl_certificate => "/etc/logstash/certs/logstash.crt"
    # ssl_key         => "/etc/logstash/certs/logstash.key"
  }
}

filter {
  # Drop the http input's request metadata; the documents already are ECS.
  mutate {
    remove_field => ["[http]", "[url]", "[user_agent]", "[host]"]
  }

  # Enrichment example: tag events from your own public networks and add an owner.
  # if [source][ip] {
  #   cidr {
  #     address => ["%{[source][ip]}"]
  #     network => ["203.0.113.0/24", "198.51.100.0/24"]
  #     add_tag => ["own-network"]
  #   }
  # }
  # translate {
  #   source     => "[unifi][site]"
  #   target     => "[organization][name]"
  #   dictionary => { "amsterdam" => "Example BV" "utrecht" => "Example Utrecht" }
  #   fallback   => "unknown"
  # }
  # if [unifi][category] == "dns" { drop { } }
}

output {
  elasticsearch {
    hosts                 => ["https://es.example.com:9200"]
    api_key               => "${ES_API_KEY}"   # id:api_key
    data_stream           => "true"
    data_stream_type      => "logs"
    data_stream_dataset   => "unifi.syslog"
    data_stream_namespace => "default"
    # Keep the document ids from UniFi Syslog Server so retries do not duplicate:
    # document_id => "%{[event][id]}"   # requires action "create", which data streams use
  }
  # stdout { codec => rubydebug }
}
