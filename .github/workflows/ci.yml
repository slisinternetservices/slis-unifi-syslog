name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - run: cd web && node scripts/i18n-check.mjs
      - run: go vet ./... && go test ./...
      - run: bash -n install-slis.sh deploy/install.sh deploy/install-clickhouse.sh ct/unify-syslog-server.sh install/unify-syslog-server-install.sh deploy/install-probe.sh ct/unify-syslog-probe.sh install/unify-syslog-probe-install.sh rpi/build-image.sh
